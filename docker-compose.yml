# Doku/Vorlage — Coolify nutzt den Dockerfile-Buildpack (Port 3000, Persistent Storage /data).
# Port 3000 ist bewusst NUR intern freigegeben (expose): Der Server vertraut der Proxy-Topologie
# (Traefik hängt die Client-IP rechts an X-Forwarded-For an, s. server/lib/auth.mjs → clientIp) und darf
# nie direkt aus dem Netz erreichbar sein, sonst ließe sich z. B. das Login-Rate-Limit umgehen.
# Lokal testen (nur über 127.0.0.1): docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
      SUS_DATA_DIR: /data
      SUS_USERS: ${SUS_USERS:-[]}
      SUS_SESSION_SECRET: ${SUS_SESSION_SECRET:-}
      SUS_EXPORT_TOKEN: ${SUS_EXPORT_TOKEN:-}
      SUS_GO_LIVE_AT: ${SUS_GO_LIVE_AT:-2026-10-10T16:00:00+02:00}
      SUS_FORCE_PRIVATE: ${SUS_FORCE_PRIVATE:-0}
    volumes:
      - sus-data:/data

volumes:
  sus-data:
