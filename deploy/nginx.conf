server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Security-Header
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed Assets: lange cachen
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # 404 mit Variantencharakter: je Varianten-Prefix die eigene 404-Seite
    location /a/ { try_files $uri $uri/index.html /a/404/index.html; }
    location /b/ { try_files $uri $uri/index.html /b/404/index.html; }
    location /c/ { try_files $uri $uri/index.html /c/404/index.html; }
    location / { try_files $uri $uri/index.html /404.html; }
}
