server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kompression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Security-Header
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hashed Assets: lange cachen
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /brand/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # 404 mit Variantencharakter je Prefix.
    # Wichtig: error_page statt try_files-Fallback — fehlt die 404-Datei, liefert nginx
    # dann ein schlichtes 404 statt eines 500 (das war die Ursache der bisherigen 500er).
    location /a/ { error_page 404 /a/404/index.html; try_files $uri $uri/index.html =404; }
    location /b/ { error_page 404 /b/404/index.html; try_files $uri $uri/index.html =404; }
    location /c/ { error_page 404 /c/404/index.html; try_files $uri $uri/index.html =404; }
    location /d/ { error_page 404 /d/404/index.html; try_files $uri $uri/index.html =404; }
    location / { error_page 404 /404.html; try_files $uri $uri/index.html =404; }
}
